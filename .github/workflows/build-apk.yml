name: Build MOJO Drive APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Guard stable v0.12 engine
        run: python3 tools/baseline_guard.py

      - name: Replay golden stable trips
        run: python3 tools/replay_harness.py --self-test

      - name: Validate road geometry evidence
        run: python3 tools/road_geometry_shadow_test.py

      - name: Validate field-warning veto regression
        run: python3 tools/negative_route_warning_regression.py

      - name: Guard explicit negative-route live veto
        run: python3 tools/negative_route_veto_guard.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOJODrive-MVP-0.15-debug
          path: app/build/outputs/apk/debug/app-debug.apk
